<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0f0f18" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)" stroke="#2d2d42" stroke-width="8" />

  <!-- Target Concentric Circles Matching TargetIcon (Balanced Scale & Padding) -->
  <g filter="url(#glow)">
    <!-- Outer Circle -->
    <circle cx="512" cy="512" r="275" fill="none" stroke="url(#purpleGrad)" stroke-width="50" stroke-linecap="round" />
    
    <!-- Middle Circle -->
    <circle cx="512" cy="512" r="170" fill="none" stroke="url(#purpleGrad)" stroke-width="50" stroke-linecap="round" />
    
    <!-- Inner Bullseye Solid Dot -->
    <circle cx="512" cy="512" r="65" fill="url(#purpleGrad)" />
  </g>
</svg>
